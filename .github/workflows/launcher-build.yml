name: Launcher Build

# Windows 런처 빌드/게시 (미서명 — 지인 한정 배포, 결정 D).
# macOS 는 최종 단계(결정 C, Apple 공증 필요) — 아래 주석 job 으로 준비됨.

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher-build.yml']
  workflow_dispatch:
  release:
    types: [created]

# release 자산 업로드(softprops/action-gh-release)에 contents:write 필요.
# 없으면 "Resource not accessible by integration" 으로 Attach 단계 실패.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 릴리즈 빌드에만 실서버 IP 주입(공개 소스엔 placeholder 유지 — secret 으로 치환).
      - name: Bake server IP (release only)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ip = '${{ secrets.HERMA_SERVER_IP }}'
          if (-not $ip) { Write-Error 'HERMA_SERVER_IP secret not set'; exit 1 }
          $f = 'launcher/src/HermaLauncher/LauncherConfig.cs'
          (Get-Content $f) -replace 'play\.example\.com', $ip | Set-Content $f
          if (Select-String -Path $f -Pattern 'play\.example\.com' -Quiet) { Write-Error 'bake failed'; exit 1 }

      - name: Build
        run: dotnet build launcher/src/HermaLauncher/HermaLauncher.csproj -c Release

      # Velopack vpk 는 단일파일이 아닌 "폴더" 산출물을 패키징한다(자체 Setup.exe/델타 생성).
      - name: Publish (self-contained 폴더 — Velopack 용)
        run: >
          dotnet publish launcher/src/HermaLauncher/HermaLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish/win-x64

      # 비-릴리즈(push/dispatch): 폴더 산출물을 테스트 아티팩트로.
      - uses: actions/upload-artifact@v4
        with:
          name: HermaLauncher-win-x64
          path: publish/win-x64

      # ── 릴리즈: Velopack 패키징 + GitHub Releases 업로드(자동 업데이트 피드) ──
      # 친구는 HermaLauncher-win-Setup.exe 로 1회 설치 → 이후 앱이 GithubSource 로 자동 업데이트.
      # (앱 측 이미 구현됨: Program.Main 의 VelopackApp.Build().Run() + VelopackUpdateService GithubSource)
      # ※ vpk 툴 버전은 앱의 Velopack NuGet(1.2.0)과 맞춘다 — 불일치 시 패키지 포맷 mismatch.
      - name: Velopack 패키징 + 업로드 (release only)
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $ver = $tag.TrimStart('v')
          if (-not $ver) { Write-Error 'release tag 가 비어있음'; exit 1 }
          dotnet tool install -g vpk --version 1.2.0
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force -Path Releases | Out-Null
          # 이전 릴리스를 받아 델타 베이스로 사용(첫 릴리스면 비어도 계속 진행).
          vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir Releases
          vpk pack --packId HermaLauncher --packVersion $ver --packTitle "Herma Launcher" `
            --packDir publish/win-x64 --mainExe HermaLauncher.exe --outputDir Releases
          # --merge: release:created 로 이미 존재하는 릴리스에 자산을 합쳐 올림.
          vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN `
            --tag $tag --releaseName "Herma Launcher $ver" --merge --outputDir Releases

  # ── macOS (ad-hoc 서명, 미공증 — 결정 C "인증 나중, 앱 전달만") ──────────────
  # Apple Silicon(.app)이 실행되려면 ad-hoc 서명이 필수(공증과 별개). codesign 은 macOS 전용이라
  # macos-14 러너에서 빌드+서명. 친구 Mac 에선 처음 1회 우클릭→열기(미공증 경고 통과).
  # 공증(notarytool, Developer ID $99/년)은 최종 단계 — 아래 주석 참고.
  macos:
    runs-on: macos-14            # Apple Silicon 러너
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 릴리즈 빌드에만 실서버 IP 주입(공개 소스엔 placeholder 유지 — secret 으로 치환).
      - name: Bake server IP (release only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          IP='${{ secrets.HERMA_SERVER_IP }}'
          [ -z "$IP" ] && { echo 'HERMA_SERVER_IP not set'; exit 1; }
          f=launcher/src/HermaLauncher/LauncherConfig.cs
          perl -pi -e "s/play\\.example\\.com/$IP/" "$f"
          grep -q 'play.example.com' "$f" && { echo 'bake failed'; exit 1; } || echo 'baked'

      - name: Publish (osx-arm64, self-contained, .app 용 dylib 분리)
        run: >
          dotnet publish launcher/src/HermaLauncher/HermaLauncher.csproj
          -c Release -r osx-arm64 --self-contained true
          -p:PublishSingleFile=false
          -o publish/osx-arm64

      - name: Bundle .app + ad-hoc sign
        shell: bash
        run: VERSION="${TAG#v}" bash launcher/build-mac-app.sh publish/osx-arm64 publish/mac
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: HermaLauncher-macos-arm64
          path: publish/mac/HermaLauncher-macos-arm64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/mac/HermaLauncher-macos-arm64.zip

  # ── (최종 단계) 공증 — Apple Developer($99/년) 확보 후 위 job 의 서명 단계를 교체 ──
  #   vpk pack --signAppIdentity "Developer ID Application: ..." --notaryProfile AC_PASSWORD
  #   전제: APPLE_* secrets(Developer ID .p12 + notarytool app-specific password).
