name: Launcher Build

# Windows 런처 빌드/게시 (미서명 — 지인 한정 배포, 결정 D).
# macOS 는 최종 단계(결정 C, Apple 공증 필요) — 아래 주석 job 으로 준비됨.

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher-build.yml']
  workflow_dispatch:
  release:
    types: [created]

# release 자산 업로드(softprops/action-gh-release)에 contents:write 필요.
# 없으면 "Resource not accessible by integration" 으로 Attach 단계 실패.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # 릴리즈 빌드에만 실서버 IP 주입(공개 소스엔 placeholder 유지 — secret 으로 치환).
      - name: Bake server IP (release only)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ip = '${{ secrets.HERMA_SERVER_IP }}'
          if (-not $ip) { Write-Error 'HERMA_SERVER_IP secret not set'; exit 1 }
          $f = 'launcher/src/HermaLauncher/LauncherConfig.cs'
          (Get-Content $f) -replace 'play\.example\.com', $ip | Set-Content $f
          if (Select-String -Path $f -Pattern 'play\.example\.com' -Quiet) { Write-Error 'bake failed'; exit 1 }

      # 온라인 로그인 client ID 주입(MS 승인 완료 — allow list 등록). placeholder all-zero(Guid.Empty)
      # 리터럴 1곳을 실제 ID 로 치환. 게이트(IsAzureClientConfigured)는 Guid.Empty 비교라 bake 와 무충돌.
      - name: Bake Azure client ID (release only)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $cid = '${{ secrets.HERMA_AZURE_CLIENT_ID }}'
          if (-not $cid) { Write-Error 'HERMA_AZURE_CLIENT_ID secret not set'; exit 1 }
          $f = 'launcher/src/HermaLauncher/LauncherConfig.cs'
          (Get-Content $f) -replace '00000000-0000-0000-0000-000000000000', $cid | Set-Content $f
          if (Select-String -Path $f -Pattern '00000000-0000-0000-0000-000000000000' -Quiet) { Write-Error 'bake failed'; exit 1 }

      # 버전 메타데이터를 release tag 로 주입(P2-4 — csproj 정적 0.1.0 과 런타임 버전 불일치 해소).
      - name: Set version (release)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ver = '${{ github.event.release.tag_name }}'.TrimStart('v')
          "HERMA_VER=$ver" >> $env:GITHUB_ENV
          if ($ver -match '^(\d+\.\d+\.\d+)') { "HERMA_ASMVER=$($Matches[1]).0" >> $env:GITHUB_ENV }

      - name: Build
        run: >
          dotnet build launcher/src/HermaLauncher/HermaLauncher.csproj -c Release
          -p:Version=${{ env.HERMA_VER || '0.1.0' }}
          -p:InformationalVersion=${{ env.HERMA_VER || '0.1.0-dev' }}
          -p:AssemblyVersion=${{ env.HERMA_ASMVER || '0.1.0.0' }}
          -p:FileVersion=${{ env.HERMA_ASMVER || '0.1.0.0' }}

      # Velopack vpk 는 단일파일이 아닌 "폴더" 산출물을 패키징한다(자체 Setup.exe/델타 생성).
      - name: Publish (self-contained 폴더 — Velopack 용)
        run: >
          dotnet publish launcher/src/HermaLauncher/HermaLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ env.HERMA_VER || '0.1.0' }}
          -p:InformationalVersion=${{ env.HERMA_VER || '0.1.0-dev' }}
          -p:AssemblyVersion=${{ env.HERMA_ASMVER || '0.1.0.0' }}
          -p:FileVersion=${{ env.HERMA_ASMVER || '0.1.0.0' }}
          -o publish/win-x64

      # 비-릴리즈(push/dispatch): 폴더 산출물을 테스트 아티팩트로.
      - uses: actions/upload-artifact@v7
        with:
          name: HermaLauncher-win-x64
          path: publish/win-x64

      # ── 릴리즈: Velopack 패키징 + GitHub Releases 업로드(자동 업데이트 피드) ──
      # 친구는 HermaLauncher-win-Setup.exe 로 1회 설치 → 이후 앱이 GithubSource 로 자동 업데이트.
      # (앱 측 이미 구현됨: Program.Main 의 VelopackApp.Build().Run() + VelopackUpdateService GithubSource)
      # ※ vpk 툴 버전은 앱의 Velopack NuGet(1.2.0)과 맞춘다 — 불일치 시 패키지 포맷 mismatch.
      - name: Velopack 패키징 + 업로드 (release only)
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $ver = $tag.TrimStart('v')
          if (-not $ver) { Write-Error 'release tag 가 비어있음'; exit 1 }
          dotnet tool install -g vpk --version 1.2.0
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force -Path Releases | Out-Null
          # 이전 릴리스를 받아 델타 베이스로 사용(첫 릴리스면 비어도 계속 진행).
          vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir Releases
          if ($LASTEXITCODE -ne 0) { Write-Host "이전 릴리스 다운로드 스킵(첫 릴리스 등) — 계속"; $global:LASTEXITCODE = 0 }
          vpk pack --packId HermaLauncher --packVersion $ver --packTitle "Herma Launcher" `
            --packDir publish/win-x64 --mainExe HermaLauncher.exe --outputDir Releases
          # --merge: release:created 로 이미 존재하는 릴리스에 자산을 합쳐 올림.
          vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN `
            --tag $tag --releaseName "Herma Launcher $ver" --merge --outputDir Releases

  # ── macOS (ad-hoc 서명, 미공증 — 결정 C "인증 나중, 앱 전달만") ──────────────
  # Apple Silicon(.app)이 실행되려면 ad-hoc 서명이 필수(공증과 별개). codesign 은 macOS 전용이라
  # macos-14 러너에서 빌드+서명. 친구 Mac 에선 처음 1회 우클릭→열기(미공증 경고 통과).
  # 공증(notarytool, Developer ID $99/년)은 최종 단계 — 아래 주석 참고.
  macos:
    runs-on: macos-14            # Apple Silicon 러너
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # 릴리즈 빌드에만 실서버 IP 주입(공개 소스엔 placeholder 유지 — secret 으로 치환).
      - name: Bake server IP (release only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          IP='${{ secrets.HERMA_SERVER_IP }}'
          [ -z "$IP" ] && { echo 'HERMA_SERVER_IP not set'; exit 1; }
          f=launcher/src/HermaLauncher/LauncherConfig.cs
          perl -pi -e "s/play\\.example\\.com/$IP/" "$f"
          grep -q 'play.example.com' "$f" && { echo 'bake failed'; exit 1; } || echo 'baked'

      # 온라인 로그인 client ID 주입(MS 승인 완료). placeholder all-zero(Guid.Empty) 1곳을 실제 ID 로 치환.
      - name: Bake Azure client ID (release only)
        if: github.event_name == 'release'
        shell: bash
        run: |
          CID='${{ secrets.HERMA_AZURE_CLIENT_ID }}'
          [ -z "$CID" ] && { echo 'HERMA_AZURE_CLIENT_ID not set'; exit 1; }
          f=launcher/src/HermaLauncher/LauncherConfig.cs
          perl -pi -e "s/00000000-0000-0000-0000-000000000000/$CID/" "$f"
          grep -q '00000000-0000-0000-0000-000000000000' "$f" && { echo 'bake failed'; exit 1; } || echo 'baked'

      # 버전 메타데이터 release tag 주입(P2-4 — Windows job 과 동일).
      - name: Set version (release)
        if: github.event_name == 'release'
        shell: bash
        run: |
          ver="${TAG#v}"
          echo "HERMA_VER=$ver" >> "$GITHUB_ENV"
          asm=$(echo "$ver" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo '0.1.0')
          echo "HERMA_ASMVER=$asm.0" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish (osx-arm64, self-contained, .app 용 dylib 분리)
        run: >
          dotnet publish launcher/src/HermaLauncher/HermaLauncher.csproj
          -c Release -r osx-arm64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ env.HERMA_VER || '0.1.0' }}
          -p:InformationalVersion=${{ env.HERMA_VER || '0.1.0-dev' }}
          -p:AssemblyVersion=${{ env.HERMA_ASMVER || '0.1.0.0' }}
          -p:FileVersion=${{ env.HERMA_ASMVER || '0.1.0.0' }}
          -o publish/osx-arm64

      - name: Bundle .app + ad-hoc sign
        shell: bash
        run: VERSION="${TAG#v}" bash launcher/build-mac-app.sh publish/osx-arm64 publish/mac
        env:
          TAG: ${{ github.event.release.tag_name }}

      # 비-릴리스(push) 테스트용 ad-hoc 아티팩트만 — 릴리스에는 첨부하지 않는다.
      # 릴리스의 macOS 산출물은 아래 Velopack 의 서명+공증된 .pkg / osx-Portable.zip 이다
      # (ad-hoc(미공증) zip 을 릴리스에 같이 붙이면 친구가 그걸 받아 Gatekeeper 경고를 보게 돼 혼동).
      - uses: actions/upload-artifact@v7
        with:
          name: HermaLauncher-macos-arm64
          path: publish/mac/HermaLauncher-macos-arm64.zip

      # ── macOS 자동 업데이트(Velopack) — Developer ID 인증서(.p12)가 있을 때만 활성 ──
      # macOS 의 Velopack 자동 업데이트는 코드 서명이 사실상 필수다: Gatekeeper 가 미서명 .app 의
      # in-place 업데이트 교체를 거부하고, vpk 도 ad-hoc/미서명 macOS 경로를 공식 지원하지 않는다.
      # 식별자 이름(APPLE_SIGN_IDENTITY)만으론 부족 — runner keychain 에 실제 .p12 인증서가 import 돼야
      # codesign/productsign 이 식별자를 찾는다. 그래서 .p12(APPLE_CERT_P12_BASE64) 가 있을 때만 동작한다.
      # 그 전까지는 위의 ad-hoc .app(우클릭→열기) 수동 배포 유지.
      #
      # vpk osx 는 .app(codesign) + .pkg(productsign) + portable .zip 을 만든다. .pkg 서명엔
      # Developer ID **Installer** 인증서가, .app 서명엔 Developer ID **Application** 인증서가 필요하다
      # (둘 다 한 개인키로 발급 가능 — docs/macos-release-signing.md). vpk 가 .NET 용 hardened-runtime
      # entitlements 를 자동 적용하므로 entitlements 파일은 불필요.
      #
      # 게이트 2단: signcheck(아래)는 .p12+app identity 만으로 "이 경로를 켤지"를 판단하고,
      # 켜진 release 에서는 Velopack 스텝이 나머지 필수 secret 누락 시 즉시 fail 한다(silent 서명-only 금지).
      #
      # 필요 Secret 8개 (전부 필수 — docs/macos-release-signing.md 의 단계별 생성 가이드 참조):
      #   [서명] APPLE_CERT_P12_BASE64(Application .p12), APPLE_INSTALL_CERT_P12_BASE64(Installer .p12),
      #          APPLE_CERT_PASSWORD(두 .p12 공유),
      #          APPLE_SIGN_IDENTITY(Developer ID Application — .app), APPLE_INSTALL_SIGN_IDENTITY(Developer ID Installer — .pkg)
      #   [공증] APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD(앱 암호) → notarytool 프로필 생성 후 공증(친구 경고 0)
      # ※ Apple 은 한 CSR 으로 인증서 1개만 발급하므로 Application·Installer 는 별도 키·CSR → .p12 도 2개.
      # 8개 미만이면 release 잡이 명시적으로 실패한다(첫 릴리스 전 모두 등록할 것).
      - name: 서명 자산 존재 확인
        id: signcheck
        shell: bash
        run: |
          # 식별자 이름만이 아니라 실제 인증서(.p12) material 존재로 게이트.
          if [ -n "${{ secrets.APPLE_CERT_P12_BASE64 }}" ] && [ -n "${{ secrets.APPLE_SIGN_IDENTITY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Developer ID 인증서 미설정 — macOS 자동 업데이트 비활성(ad-hoc 배포 유지)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Velopack 패키징 + 업로드 (osx, Developer ID 인증서 있을 때만)
        if: github.event_name == 'release' && steps.signcheck.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          SIGN_ID: ${{ secrets.APPLE_SIGN_IDENTITY }}
          INSTALL_ID: ${{ secrets.APPLE_INSTALL_SIGN_IDENTITY }}
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          INSTALL_CERT_P12: ${{ secrets.APPLE_INSTALL_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # 실패/중단 경로에서도 .p12 평문과 temp keychain 정리(Codex [10]).
          trap 'rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"; [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null || true' EXIT
          ver="${TAG#v}"
          [ -z "$ver" ] && { echo 'release tag 비어있음'; exit 1; }

          # (0) 서명+공증 릴리스 목표 — 누락 secret 은 silent downgrade(서명만 업로드) 대신 즉시 fail(Codex [4][11]).
          #     signcheck 게이트(p12+app identity)는 "이 경로를 켤지"만 판단하므로, 여기서 나머지 필수 secret 을 강제.
          MISSING=()
          [ -z "${INSTALL_CERT_P12:-}" ] && MISSING+=(APPLE_INSTALL_CERT_P12_BASE64)
          [ -z "${INSTALL_ID:-}" ] && MISSING+=(APPLE_INSTALL_SIGN_IDENTITY)
          [ -z "${NOTARY_APPLE_ID:-}" ] && MISSING+=(APPLE_ID)
          [ -z "${NOTARY_TEAM_ID:-}" ] && MISSING+=(APPLE_TEAM_ID)
          [ -z "${NOTARY_APP_PW:-}" ] && MISSING+=(APPLE_APP_PASSWORD)
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "ERROR: 서명+공증 릴리스에 필요한 secret 누락: ${MISSING[*]}"
            echo "  docs/macos-release-signing.md Part C 의 secret 8개를 모두 등록하세요."
            exit 1
          fi

          # (1) Developer ID 인증서(.app용 Application + .pkg용 Installer)를 임시 keychain 에 import.
          #     codesign/productsign 이 식별자를 찾으려면 runner keychain 에 실제 인증서가 있어야 함.
          KEYCHAIN="$RUNNER_TEMP/herma-sign.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          # .p12 2개 import — Application(.app codesign) + Installer(.pkg productsign). 같은 비밀번호(CERT_PW) 공유.
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          echo "$INSTALL_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/productsign -T /usr/bin/productbuild
          # 두 키 모두에 비대화형 접근 허용(partition list 는 keychain 내 전체 키에 적용).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          # (1b) 두 .p12 에서 Application·Installer 두 identity 가 모두 잡혔는지 fail-fast(Codex [7]).
          #      Application 은 codesigning policy 목록에, Installer 는 정책 없는 목록에 나온다.
          echo "== keychain code-signing identities =="
          security find-identity -v -p codesigning "$KEYCHAIN" || true
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "ERROR: Developer ID Application identity 미발견 — .p12/APPLE_SIGN_IDENTITY 확인"; exit 1; }
          security find-identity -v "$KEYCHAIN" | grep -q "Developer ID Installer" \
            || { echo "ERROR: Developer ID Installer identity 미발견 — APPLE_INSTALL_CERT_P12_BASE64 의 Installer .p12 확인"; exit 1; }

          # (2) notarytool 프로필 생성(앱 암호). --keychain 필수(미지정 시 CI 에서 credentials not found, Velopack discussion #15).
          xcrun notarytool store-credentials herma-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PW" \
            --keychain "$KEYCHAIN"
          echo "공증 활성 (notarytool 프로필 herma-notary 생성됨)"

          # (3) Velopack 패키징 — vpk 가 .NET 용 hardened-runtime entitlements 자동 적용,
          #     codesign(.app) + productsign(.pkg) + notarytool 공증까지 수행. 모든 서명/공증 인자가
          #     필수(위에서 강제)이므로 식별자(공백 포함)는 직접 따옴표로 전달 — 배열 불필요.
          dotnet tool install -g vpk --version 1.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p Releases
          # 이전 릴리스 받아 델타 베이스(첫 릴리스면 비어도 계속 — Codex [12]: 첫 osx 릴리스 외 오류도 무시됨, 첫 릴리스 검증 시 주의).
          vpk download github --repoUrl "$REPO_URL" --channel osx --token "$GH_TOKEN" --outputDir Releases || true
          vpk pack --packId HermaLauncher --packVersion "$ver" --packTitle "Herma Launcher" \
            --packDir publish/osx-arm64 --mainExe HermaLauncher \
            --channel osx --runtime osx-arm64 \
            --keychain "$KEYCHAIN" \
            --signAppIdentity "$SIGN_ID" --signInstallIdentity "$INSTALL_ID" \
            --notaryProfile herma-notary \
            --icon launcher/assets/app.icns \
            --outputDir Releases

          # (3b) 산출 .pkg 서명/공증 검증(BLOCKING) — 깨진 산출물 업로드 방지(Codex [2][5][7]).
          #      pkgutil: 미서명이면 비0 → set -e fail. stapler: 공증 staple 누락이면 fail.
          PKG=""
          for f in Releases/*.pkg; do
            if [ -e "$f" ]; then PKG="$f"; break; fi
          done
          if [ -n "$PKG" ]; then
            echo "== pkg signature ($PKG) =="
            pkgutil --check-signature "$PKG"
            xcrun stapler validate "$PKG" \
              || { echo "ERROR: pkg staple 검증 실패 — 공증 미완/미staple. 첫 릴리스 진단 필요."; exit 1; }
          else
            echo "경고: Releases 에 .pkg 산출물 없음 — vpk osx 산출 형태 확인 필요"
          fi

          # (4) 업로드
          vpk upload github --channel osx --repoUrl "$REPO_URL" --token "$GH_TOKEN" \
            --tag "$TAG" --releaseName "Herma Launcher $ver" --merge --outputDir Releases
