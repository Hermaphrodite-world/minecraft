name: Launcher Build

# Windows 런처 빌드/게시 (미서명 — 지인 한정 배포, 결정 D).
# macOS 는 최종 단계(결정 C, Apple 공증 필요) — 아래 주석 job 으로 준비됨.

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher-build.yml']
  workflow_dispatch:
  release:
    types: [created]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build launcher/src/HermaLauncher/HermaLauncher.csproj -c Release

      - name: Publish (self-contained single-file, unsigned)
        run: >
          dotnet publish launcher/src/HermaLauncher/HermaLauncher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: HermaLauncher-win-x64
          path: publish/win-x64/HermaLauncher.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/HermaLauncher.exe

  # ── macOS (최종 단계 — 결정 C 확정 후 활성화) ──────────────────────────────
