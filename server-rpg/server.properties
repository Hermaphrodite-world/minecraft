# Hermaphrodite RPG — NeoForge 서버 설정 (MC 1.21.1)
# 보안 핵심: online-mode + 화이트리스트 필수(정식 서버와 동일 정책).

# online-mode=true  : MS 정품 인증 필요(런처 오프라인 모드 해제 + Azure 앱).
# online-mode=false : 친구끼리(지인) 서버 — MS 로그인 없이 닉네임 + 화이트리스트로 운영.
#   런처의 "오프라인 모드"(기본 ON)로 바로 접속. 가장 단순. 닉네임 기반 whitelist 사용.
online-mode=false
white-list=true
enforce-whitelist=true

# 색 코드(§)는 인코딩 이슈 방지 위해 플레인 텍스트로. 색 원하면 § 이스케이프 사용.
motd=Hermaphrodite RPG | 1.21.1 NeoForge

# 소규모 친구 서버 — RAM 절약
max-players=10
view-distance=10
simulation-distance=8
spawn-protection=0

difficulty=normal
gamemode=survival
pvp=true

# RPG 팩에는 비행 마법/아이템(Iron's Spells, Artifacts)이 있어 allow-flight=true 필수.
#   false 면 합법적 비행을 "Flying is not enabled" 로 강제 추방한다.
allow-flight=true
level-seed=
level-name=world

# RCON: 쓸 경우에만 true + 강한 비밀번호 + 포트 외부 비공개(방화벽)
enable-rcon=false
rcon.port=25575
rcon.password=

# 정식(Fabric) 서버와 동시에 켤 경우 포트 충돌 주의 — 정식=25565. 별도 포트 권장.
server-port=25565
