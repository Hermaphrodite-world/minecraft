# Hermaphrodite World — Fabric 서버 설정 (MC 26.1.2)
# 보안 핵심(추가모드_서버스택.md §6): online-mode + 화이트리스트 필수.

online-mode=true
white-list=true
enforce-whitelist=true

# 색 코드(§)는 인코딩 이슈 방지 위해 플레인 텍스트로. 색 원하면 § 이스케이프 사용.
motd=Hermaphrodite World | 26.1.2 Fabric

# 소규모 친구 서버 — RAM 절약
max-players=10
view-distance=10
simulation-distance=8
spawn-protection=0

difficulty=normal
gamemode=survival
pvp=true
allow-flight=false
level-seed=
level-name=world

# RCON: 쓸 경우에만 true + 강한 비밀번호 + 포트 외부 비공개(방화벽)
enable-rcon=false
rcon.port=25575
rcon.password=

server-port=25565
# Simple Voice Chat 은 별도 UDP 24454 (방화벽에서 개방)
